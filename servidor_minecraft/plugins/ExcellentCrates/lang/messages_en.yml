      NoKey: '&f¡No tienes una llave para este crate!'
      NoRewards: '&f¡Este crate no contiene ninguna recompensa para ti!'
      Cost:
        Money: '&f¡No tienes suficiente dinero para abrir este crate!'
        Exp: '&f¡No tienes suficientes niveles de experiencia para abrir este crate!'
      NoHoldKey: '&cYou must hold a key to open this crate!'
