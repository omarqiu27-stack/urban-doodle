Command:
  Drop:
    Usage: <crateId> <world> <x> <y> <z>
    Desc: Dropear una crate en un ubicación determinada en el mundo.
    Done: Se ha dropeado un &e%crate_name%&7 en &e%x%&7, &e%y%&7, &e%z%&7 en &e%world%&7.
  ForceOpen:
    Desc: Forzar la apertura de una crate para un jugador.
    Usage: <crateId> [player]
    Done: Se ha forzado la apertura de &e%crate_name%&7 para &e%player_name%&7.
    Notify: Has sido forzado a abrir una &e%crate_name%&7.
  Give:
    Usage: <player | *> <crateId> [amount]
    Desc: Dar una(s) crate(s) a un jugador.
    Done: Se ha dado &ex%amount% &7crate(s) de &e%crate_name% &7a &e%player_name%&7.
    Notify: ¡Has recibido &ex%amount% &7de &e%crate_name%&7!
  Key:
    Desc: Administre o vea las llaves de caja del jugador.
    Error:
      Player: '&f¡No se pudo procesar la operación para el jugador fuera de línea/inválido &e%player_name%&f!'
    Give:
      Usage: <player | *> <keyId> [amount]
      Desc: Dar llave(s) de crate a un jugador.
      Done: Se ha dado &ex%amount% &7llave(s) de &e%key_name% &7a &e%player_name%&7.
      Notify: ¡Has recibido &ex%amount% &7de &e%key_name%&7!
    Take:
      Usage: <player | *> <keyId> [amount]
      Desc: Tomar llave(s) del crate de un player.
      Done: Se ha tomado &ex%amount% &7llave(s) de &e%key_name% &7de &e%player_name%
      Notify: ¡Perdiste &ex%amount% &e%key_name%&7!
    Set:
      Usage: <player | *> <keyId> <amount>
      Desc: Establezca la cantidad de claves de caja para un jugador.
      Done: Establezca &ex%amount% &fof &e%key_name% &fkey(s) para &e%player_name%&f.
      Notify: ¡Tu cantidad de &e%key_name%&f ha sido cambiada a &ex%amount%&f!
    Show:
      Desc: Muestra la cantidad de tus llaves de jugador o de otras.
      Usage: '[player]'
      Format:
        List:
        - <!prefix:"false"!>
        - '&6&m              &6&l[ &a%player_name% &e&lLlaves de caja &6&l]&6&m              &6'
        - '&7'
        - '&6▸ &e%key_name%: &6%amount%'
    Usage: '[help]'
    GiveAll:
      Usage: <player> <key> <amount> [-s]
      Desc: Give key to all online players.
      Done: '#d4d9d8Given #fdf35ex%amount%#d4d9d8 of #fdf35e%key_name%#d4d9d8 key(s) to #fdf35eAll Players#d4d9d8.'
  Preview:
    Desc: Abrir la vista previa de la crate.
    Usage: <crateId> [player]
    Done:
      Others: Se ha abierto la vista previa de &e%crate_name%&7 para &e%player_name%&7.
  ResetLimit:
    Desc: Restablecer el límite de victorias de recompensa para el crate y la recompensa especificados.
    Usage: <player> <crateId> [rewardId]
    Done:
      Crate: Restablecer el límite de victorias de &e%player_name% &7para todas las recompensas de &e%crate_name%&7.
      Reward: Restablecer el límite de victorias de &e%player_name% &7para la recompensa &e%reward_name% &7de &e%crate_name%&7.
  ResetCooldown:
    Desc: Restablecer el cooldown del jugador para el crate especificado.
    Usage: <player> <crateId>
    Done: Restablecer el cooldown de &e%player_name% &7para &e%crate_name%&7.
  Menu:
    Usage: '[menuId]'
    Desc: Abrir el menú de la crate.
    Done:
      Others: Se ha abierto el menú de la crate &e%menu_id%&7 para &e%player_name%&7.
  Editor:
    Desc: Open crates & keys editor.
  Open:
    Desc: Makes [player] to [force] open a crate.
    Usage: <crate> [player] [-f] [-s]
    Done: '#d4d9d8Forced #fdf35e%player_name%#d4d9d8 to open #fdf35e%crate_name%#d4d9d8.'
    Notify: '#d4d9d8You have been forced to open #fdf35e%crate_name%#d4d9d8.'
Crate:
  Error:
    Invalid: '&f¡Crate inválida!'
    Exists: '#fd5e5eCrate with such id is already exists!'
  Open:
    Error:
      InventorySpace: '&f¡Por favor, limpia tu inventario para abrir el crate!'
