# Place the item in your hand on your head
# Permissions: smartcore.hat.use
hat:
  enabled: true
  allowedMaterials:
  - leather_horse_armor
  successMessage: '&f &f¡Disfruta de tu nuevo sombrero!'
  badMaterialMessage: '&f &f¡No puedes poner eso en tu cabeza!'
  noItemMessage: '&f &f¡No tienes ningún artículo en la mano!'
  notEnoughSpaceMessage: '&f &f¡No tienes suficiente espacio en tu inventario!'
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'
  regionFlagMessage: '&f &fAquí no se pueden usar sombreros.'

# Displays an improved plugin list
# Permissions: smartcore.pluginlist.use
pluginList:
  enabled: true
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'
  message: '&f &9Plugins (%count%): %plugins%'
  separator: '&f, '
  pluginName: '%name%'
  enabledPrefix: '&a'
  disabledPrefix: '&c'
  pluginHover:
  - '&fVersion: &b%version%'
  - '&fAuthor: &b%authors%'


# Resource pack loader
resourcePackLoader:
  enabled: true
  forceResourcePack: true
  onlyOnFirstJoin: true
  resourcePack: '' # Leave empty to use resource pack from server.properties
  prompt: '&e&l¡Este servidor requiere textura para una experiencia agradable!' # Leave empty to use prompt from server.properties
  delay: 80
