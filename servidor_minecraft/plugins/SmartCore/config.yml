enabledPlaceholder: Enabled
disabledPlaceholder: Disabled

# Allows the use of colors in anvils
# Permissions: smartcore.anvilcolors.use
anvilColors:
  enabled: true

# Adds autocomplete for specific custom commands
autoComplete:
  enabled: true
  commands:
  - battlepass

# Allows the use of totems without requiring them to be in the off hand
# Permissions: smartcore.autototem.use
autoTotem:
  enabled: true
  default: true
  firstTimeMessage: '&f &fPuede alternar el tótem automático usando &e/autototem&f'
  enabledMessage: '&f &fHas &ehabilitado&f tótem automático'
  disabledMessage: '&f &fHas &edhabilitado&f tótem automático'
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'

# Allows opening two connected doors at the same time and iron doors
# Permissions: smartcore.doubledoors.open, smartcore.doubledoors.iron_doors
doubleDoors:
  enabled: true
  default: true
  firstTimeMessage: '&f &fPuede alternar la apertura de puertas dobles y de hierro
    usando &e/doubledoors&f'
  enabledMessage: '&f &fTienes &ehabilitado&f apertura de puertas dobles y de hierro'
  disabledMessage: '&f &fHas &edhabilitado&f apertura de puertas dobles y de hierro'
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'
  regionDoubleDoorsFlagMessage: ''
  regionIronDoorsFlagMessage: '&f &f¡Aquí no se pueden abrir puertas de hierro!'

# Automatically picks up items for players
# Permissions: smartcore.droptoinventory.use
dropToInventory:
  enabled: true
  default: true
  fullInventoryMessage: '&cTu inventario está lleno'
  playSound: true
  firstTimeMessage: '&f &fPuede alternar la recogida automática de artículos usando
    &e/apickup'
  enabledMessage: '&f &fTienes habilitada la recogida automática de artículos.'
  disabledMessage: '&f &fHa &edhabilitado&f la recogida automática de artículos.'
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'

# Edit signs by right clicking them
# Permissions: smartcore.editablesigns.use, smartcore.editablesigns.color
editableSigns:
  enabled: true
  default: true
  replaceLegacyColorCodes: true
  firstTimeMessage: '&f &fPuede alternar la edición de signos usando &e/signit'
  enabledMessage: '&f &fHas &ehabilitado&f la edición de signos.'
  disabledMessage: '&f &fHa &edhabilitado&f la edición de signos.'
  noPermissionMessage: '&f &fNo tiene permiso para usar este comando.'

