#
#
# This file allows you to edit MOST messages in the plugin, there are some messages you
# cannot edit as they are hard coded into the plugin, if you really want those messages
# to be editable (and if there is enough support for it) I will try and add it.
# Please note that if there is ever an update to this file, like new message were added
# we take the liberty to automatically add the value into this file BUT due to the way
# Bukkit/Spigot save configuration files all of my 'helpful' comments are removed. So it
# is recommended before updating to the newest version to backup your config and messages
# file to save your work and to keep the comments.
#
# If you have questions you can post an issue on Github
# (https://github.com/itsschatten/portablecraftinginvs/issues) Also helpful if you want to
# see the code for the plugin.
# You may also join my Discord support server (https://discord.gg/BmWrNam7Sp)

# ------------------------------------------------------------------------------------- #
#                                                                                       #
#                                   Utility Messages                                    #
#                                                                                       #
# ------------------------------------------------------------------------------------- #

# Edit the prefix for the entire plugin.
prefix: "&f&f"

# The message that is sent when someone doesn't have permission to execute a command.
no-perms: "{prefix} &fLo siento, no tienes permiso para hacer eso."

# This message supports scalar. Which means you can have a multiline message be sent.
# I would suggest that you familiarize yourself with scalar to better use it then I can.
help-message: |+

  &8 »     &e▪&f▪&6▪ &fPortabe Inventories &6▪&f▪&e▪ &8     « 
  &e/anvil <player> &8-&f Abre un yunque.
  &e/blastfurnace <player> &8-&f Abrir un alto horno.
  &e/brewing <player> &8-&f Abre un puesto de preparación.
  &e/cartography <player> &8-&f Abra una tabla de cartografía.
  &e/craft <player> &8-&f Abre un banco de trabajo.
  &e/enchanttable <player> &8-&f &fAbre una mesa de chat. (Teir depende de las estanterías circundantes).
  &e/enderchest <player> &8-&f Abre tu endercofre.
  &e/furnace <player> &8-&f Abre un horno.
  &e/grindstone <player> &8-&f Abre una piedra de moler.
  &e/loom <player> &8-&f Abre un telar.
  &e/stonecutter <player> &8-&fAbre un picapedrero.
  &e/smithingtable <player> &8-&f Abre una mesa de herrería.
  &e/smoker <player> &8-&f Abre un fumador.
  &8 »     &e▪&f▪&6▪ &fPortabe Inventories &6▪&f▪&e▪ &8     « 

# The message that is sent if you disable a feature in the settings.yml.
feature-disabled: "{prefix} Esa característica está deshabilitada, lo siento por eso..."

# The message that is sent to whomever reloaded the configs
reload-message: "{prefix} El complemento ha sido recargado."

# The message that is sent to whomever reloaded the specified config.
reload-message-specific: "{prefix} El archivo {file} fue recargado."

# A message that is sent if an argument is incorrect for the command.
wrong-args: "{prefix} ¡Has agregado argumentos inapropiados!"

# The message that is sent when someone doesn't add arguments or doesn't add enough to complete a command.
not-enough-args: "{prefix} Agregue algunos argumentos más, si necesita más ayuda, use &e/pci&f."

# This message is sent when someone adds TO many arguments that aren't needed, this really isn't that useful I just
# added it in the event you want to use. (There is an option in the config to disable this.)
too-many-args: "{prefix} ¡Has añadido demasiados argumentos!"

# This message is sent when something doesn't exist.
doesnt-exist: "{prefix} Algo que has introducido no existe."

# This message is sent when a doesn't exist.
player-doesnt-exist: "{prefix}&e {player}&f no existe."

# This message is sent when an update to the plugin is available. (In-game only)
update-available: |+

  &fHay una actualización para &ePortable Crafting Invs&f!
  &f¡Le recomendamos que actualice a la última versión!
  &Actual &e{currentVer} &fNueva versión &e{newVer}&f.
  &fHaga clic en el enlace para obtenerlo. &e{link}

# ------------------------------------------------------------------------------------- #
#                                                                                       #
#                               Inventory Open Messages                                 #
#                                                                                       #
# ------------------------------------------------------------------------------------- #


# This message is sent to a player when executing /enderchest command.
opened-enderchest: "{prefix} Abrió su enderchest."

# This message is sent to a player when opening another players enderchest.
# This message has a fancy modifier that uses appropriate pluralisation to a players name.
# To use it do {playerFormatted}
open-target-enderchest-old: "{prefix} Apertura {player} enderchest."

# This message is sent when the setting 'old-enderchest' is false.
open-target-enderchest: "{prefix} Apertura {player} enderchest por {player}."

# This message is sent when opening a crafting table using /craft.
opened-craftingtable: "{prefix} Mesa de trabajo abierta."

# This message is sent to the target of /craft <target> command.
opened-craftingtable-other: "{prefix} Mesa de trabajo abierta para &e{player}&r."

# This message is sent when someone opens an anvil using /anvil.
opened-anvil: "{prefix} Yunque abierto."

# This message is sent to the target of the /anvil <target> command.
opened-anvil-other: "{prefix} Yunque abierto para {player}"

# This message is sent when opening an enchant table using /enchanttable
# (I don't plan to add an alias of /enchant for this command. This would cause issues with the regular /enchant command.)
opened-enchanttable: "{prefix} Mesa de encantamiento abierta."

# Sent when the player opens an enchant table with a defined max level.
opened-enchanttable-with-max-level: "{prefix} Mesa de encantamiento abierta con un nivel máximo de 30."

# Sent when the player passes a higher then the max defined in the settings when opening the enchant table.
must-be-in-range: "{prefix} Debe pasar un número entre &e{min}&f y &e{max}&f."

# This message is sent to the target of /enchanttable <target> command.
opened-enchanttable-other: "{prefix} Mesa de encantamiento abierta para {player}."

# The message that is sent if a player tries to take an item from their portable enderchest.
cant-retrieve-from-enderchest: "{prefix} ¡No puedes recuperar artículos de tu enderchest portátil!"

# The message that is sent when opening the grindstone.
opened-grindstone: "{prefix} Abrió la piedra de afilar."

# The message that is sent when opening the grindstone for someone else.
opened-grindstone-other: "{prefix} Abrió la piedra de afilar para {player}."

# The message that is sent when opening the loom.
opened-loom: "{prefix} Abrió el telar."

# The message that is sent when opening the loom for someone else.
opened-loom-other: "{prefix} Abrió el telar para {player}."

# The message that is sent when opening the cartography table.
opened-cartography: "{prefix} Abrió la mesa de cartografía."

# The message that is sent when opening the cartography table for someone else.
opened-cartography-other: "{prefix} Abrió la mesa de cartografía para {player}."

# The message that is sent when opening the stone cutter.
opened-stonecutter: "{prefix} Abrió el cortador de piedra."

# The message that is sent when opening the stone cutter for someone else.
opened-stonecutter-other: "{prefix} Abrió el cortador de piedra para {player}."

# The message that is sent when opening the smithing table.
opened-smithing-table: "{prefix} Abrió la mesa de herrería."

# The message that is sent when opening the smithing table for someone else.
opened-smithing-table-other: "{prefix} Abrió la mesa de herrería para {player}."

# The message that is sent when opening the furnace.
opened-brewing: "{prefix} Abrió su puesto de elaboración de cerveza virtual."

# The message that is sent when opening the furnace for someone else.
opened-brewing-other: "{prefix} Soporte de elaboración de cerveza virtual abierto para {player}."

# The message that is sent when opening the furnace.
opened-furnace: "{prefix} Abrió su horno virtual."

# The message that is sent when opening the furnace for someone else.
opened-furnace-other: "{prefix} Horno virtual abierto para {player}."

# The message that is sent when opening the blast furnace.
opened-blast-furnace: "{prefix} Abrió su alto horno virtual."

# The message that is sent when opening the blast furnace for someone else.
opened-blast-furnace-other: "{prefix} Alto horno virtual abierto para {player}."

# The message that is sent when opening the smoker.
opened-smoker: "{prefix} Abrió su fumador virtual."

# The message that is sent when opening the smoker for someone else.
opened-smoker-other: "{prefix} Fumador virtual abierto para {player}."

