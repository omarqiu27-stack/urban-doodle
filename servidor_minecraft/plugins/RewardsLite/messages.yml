noPermissionError: '&f &fNo tiene permiso para usar este comando.'

#Error given when you need to be online to use this command.
requireOnlinePlayerError: '&cDeberá iniciar sesión para usar este comando.'

#Error given when targeted player is not online.
#Placeholders: %player%
targetNotOnlineError: '&f &e%player% &factualmente no está en línea.'

#Error given when targeted player has not played on the server before.
#Placeholders: %player%
targetNotPlayedBeforeError: '&f &e%player% &fno ha jugado en el servidor antes de.'

#Error given when trying to give reward that does not exist on the server.
#Placeholders: %reward%
rewardDoesNotExist: '&f &e%reward% &fno existe en este servidor.'

#Header message when displaying a command usage.
