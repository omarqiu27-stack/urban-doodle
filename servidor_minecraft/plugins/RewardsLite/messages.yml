  en este mundo.'

#Warning given to player if eligible for a reward but inventory is too full to claim.
#Placholders: %reward_title% - %required_spaces%
inventoryFullRedeemWarning: '&f &fLa recompensa %reward_title% requiere %required_spaces%
  Espacios de inventario libres para canjear.'


